name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Аудит-2а.2: матрица 3.12 (текущий рантайм проекта) + 3.14 (get_event_loop()
      # без работающего цикла больше не создаёт новый неявно — ловим регрессии
      # заранее, а не когда прод-окружение однажды обновит интерпретатор).
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Scan for secrets
        run: python scripts/check_secrets.py

      - name: Validate content (YAML/ссылочная целостность)
        run: python -m engine.content

      - name: Compile check (engine/bot/ai/scripts)
        run: python -m compileall engine bot ai scripts -q

      - name: Run tests
        run: python run_tests.py
