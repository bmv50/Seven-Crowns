name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Аудит-2а.2: матрица 3.12 (текущий рантайм проекта) + 3.14 (get_event_loop()
      # без работающего цикла больше не создаёт новый неявно — ловим регрессии
      # заранее, а не когда прод-окружение однажды обновит интерпретатор).
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Scan for secrets
        run: python scripts/check_secrets.py

      - name: Validate content (YAML/ссылочная целостность)
        run: python -m engine.content

      - name: Compile check (engine/bot/ai/scripts)
        run: python -m compileall engine bot ai scripts -q

      - name: Run tests
        run: python run_tests.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mud_test
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: PostgreSQL character lifecycle, identity and party persistence
        run: python run_tests.py postgres_
