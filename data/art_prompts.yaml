# ─────────────────────────────────────────────────────────────
#  РУЧНЫЕ ПРОМПТЫ ДЛЯ АРТА (scripts/gen_world_images.py)
# ─────────────────────────────────────────────────────────────
# Автоматический промпт собирается из данных (описание комнаты, имя/уровень/
# стихия моба) и годится для 90% картинок. Сюда пишем ТОЛЬКО те кадры, где
# автоматика промахнулась или где важен точный образ: стартовый хаб, ключевые
# зоны, боссы. Ключ — id комнаты/моба (как в world.yaml / mobs.yaml).
#
# Стиль дописывается сам — пишите только СОДЕРЖАНИЕ кадра. Проверить текст без
# генерации:  python scripts/gen_world_images.py --type mob --ids <id> --dry-run
# Перегенерить точечно: python scripts/gen_world_images.py --type mob --ids <id>
#
# Что реально помогает в формулировке:
#   • существительные и материалы («ржавая кираса», «мокрый гранит»), а не эпитеты;
#   • ОДИН смысловой центр кадра — модель путается от «и то, и это»;
#   • свет отдельной фразой («единственный источник — синие угли в жаровне»);
#   • ракурс («вид от земли снизу вверх», «поясной портрет три четверти»);
#   • чего быть НЕ должно — прямо словами («без людей в кадре»).

rooms:
  # Личная комната игрока на чердаке гостиницы «Туманный очаг».
  # Ключевое: кадр ИЗНУТРИ помещения, кровать и сундук у стены, никаких людей.
  inn_room: >
    Интерьер тесной комнаты под скошенной крышей на чердаке средневековой
    таверны, вид изнутри помещения от двери. У левой стены — узкая деревянная
    кровать, застеленная грубым шерстяным одеялом, рядом табурет с оплывшей
    свечой. У правой стены под скатом крыши стоит крепкий дубовый сундук,
    окованный чёрным железом, с массивным навесным замком; крышка закрыта.
    Между ними в торце — небольшое окно со свинцовым переплётом, за стеклом
    ночной туман и черепичные крыши. Тёплый свет свечи и очага играет на
    тёсаных досках пола и балках потолка. В кадре нет людей и нет животных.

  # Стартовый хаб — первое, что видит игрок. Ручной промпт нужен потому, что в
  # описании комнаты есть «столб с указателями», а в теме людских зон были
  # «кованые вывески» — и то, и другое модель покрывала кривыми псевдобуквами.
  # Здесь этих слов нет вовсе, а запрет письменности вынесен в конец отдельно.
  village: >
    Площадь маленького средневекового городка ранним утром, широкий план.
    В центре площади на выщербленном каменном постаменте стоит гладкий
    менгир-обелиск, мерцающий изнутри холодным синим светом — единственный
    магический элемент кадра. Вокруг — мокрая брусчатка с лужами, приземистые
    фахверковые дома с черепичными крышами, деревянный колодец с воротом,
    бочки, плетёные корзины и кованые фонари на столбах. Низкий туман стелется
    у земли между домами, вдали улицы уходят в дымку. Мягкий пасмурный
    рассветный свет, тёплые огоньки в редких окнах.
    Полностью гладкие стены и столбы: без вывесок, указателей, табличек,
    афиш, гербов и любых надписей — ни одной буквы в кадре. Людей нет.

items:
  # Ключ — id предмета из data/items.yaml.
  # Точечно:  py scripts/gen_item_images.py --ids <id> --dry-run
  # Кадр предмета: один объект целиком, по центру, на нейтральном фоне —
  # рамку по редкости бот рисует сам, поэтому фон должен быть простым.
  # Пример:
  # amulet_str: >
  #   Массивный медальон из потемневшего серебра на кожаном шнуре, вид спереди.
  #   В центре — необработанный багровый гранат в когтистой оправе. Поверхность
  #   украшена только чеканкой и насечкой: ни букв, ни цифр, ни рун.
  #   Один предмет на гладком тёмном фоне, мягкий боковой свет.

mobs:
  # Пример: автоматика по корню «падш» решила, что это демон — поправляем.
  # падший_король: >
  #   Иссохший мёртвый король в ржавой короне и истлевшей мантии, поясной портрет,
  #   пустые глазницы горят тусклым синим, скелетная рука сжимает щербатый меч.
  #   Позади — обломки трона. Свет холодный, снизу.
