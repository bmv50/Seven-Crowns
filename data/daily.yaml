# Ежедневные задания — ШАБЛОНЫ (ротация по дате).
#
# До 2026-08-12 здесь лежали 6 заданий с ЖЁСТКО ПРИШИТЫМ мобом 1–3 уровня
# (крыса, волк, городской голубь). На 25 уровне ежедневка предлагала убить
# 8 крыс за 120 опыта при потребности 2 640 — то есть переставала быть
# заданием примерно там же, где игрок начинал в ней нуждаться.
#
# Теперь запись — это ОБЁРТКА (имя + текст), а конкретная цель, счётчик и
# награда подбираются под уровень игрока в engine/daily.py тем же окном
# уровней и той же формулой награды, что и ИИ-поручения (engine/errands.py).
# Плейсхолдеры в desc: {mob} — имя цели, {count} — сколько нужно.
#
# Обратная совместимость: если у записи задан явный `mob` (плюс `count` и
# `reward`), она считается ЗАКРЕПЛЁННОЙ и по уровню НЕ пересчитывается — так
# можно оставлять фиксированными authored-события и праздничные задания.

заказ_на_охоту:
  name: "Заказ на охоту"
  desc: "На доске объявлений висит заказ: {mob} расплодились сверх меры. Требуется {count}."
  type: kill

расчистить_тропу:
  name: "Расчистить тропу"
  desc: "Торговцы боятся идти дальше — дорогу держат {mob}. Разгоните: хватит {count}."
  type: kill

ночной_обход:
  name: "Ночной обход"
  desc: "Стража просит подсобить в обходе. Встретите {mob} — гоните прочь, счётом {count}."
  type: kill

долг_перед_общиной:
  name: "Долг перед общиной"
  desc: "Община собирает добровольцев: {mob} снова подходят близко. Нужно {count}."
  type: kill

проредить_логово:
  name: "Проредить логово"
  desc: "Разведка донесла о логове. Пока оно не разрослось, стоит убрать {count} — {mob}."
  type: kill

слухи_с_окраин:
  name: "Слухи с окраин"
  desc: "С окраин доходят дурные слухи: {mob}. Проверьте и уймите — {count} довольно."
  type: kill

плата_за_проход:
  name: "Плата за проход"
  desc: "За безопасный проход просят услугу: убрать {mob} числом {count}."
  type: kill

наградной_лист:
  name: "Наградной лист"
  desc: "В наградном листе сегодня {mob}. За {count} обещана плата."
  type: kill
